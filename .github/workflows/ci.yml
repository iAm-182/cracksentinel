name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -coverprofile=coverage.out
      - run: go build -o /dev/null ./cmd/scanner

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, out: scanner.exe }
          - { goos: linux, goarch: amd64, out: scanner }
          - { goos: darwin, goarch: arm64, out: scanner-mac }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X gamecrack-scanner/internal/version.Version=${VERSION} -X gamecrack-scanner/internal/version.Commit=${COMMIT} -X gamecrack-scanner/internal/version.BuildDate=${DATE}"
          # -s -w strips the symbol table: a smaller binary carries less
          # string surface, which matters for a malware scanner.
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "$LDFLAGS -s -w" -o ${{ matrix.out }} ./cmd/scanner
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.out }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: package bundles (win/linux/mac)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for target in "windows amd64" "linux amd64" "darwin arm64"; do
            set -- $target
            echo "==> packaging $1/$2"
            GOOS="$1" GOARCH="$2" bash scripts/package.sh "$VERSION"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dist/*.zip
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## CrackSentinel ${{ github.ref_name }}

            Defensive malware scanner for cracked-game folders.

            ```
            scanner.exe <folder> -html report.html
            ```

            | Platform | Bundle |
            |---|---|
            | Windows | `cracksentinel-*-windows-amd64.zip` |
            | Linux | `cracksentinel-*-linux-amd64.zip` |
            | macOS | `cracksentinel-*-darwin-arm64.zip` |

            Optional extras (auto-detected, everything works without them):
            `yara`/`yara64` (YARA layer), `upx` (packed-PE auto-unpack),
            `7z` (7z/rar/iso container expansion), `docker` (behavioural detonation).

            ### If your antivirus flags the binary

            A malware scanner looks for the names of the APIs it hunts and
            the credential targets it knows, and a machine learning
            classifier can read that as an information stealer. The
            indicators in this build are obfuscated, but if your antivirus
            still quarantines it, add an exclusion for the folder you put
            it in:

            ```powershell
            Add-MpPreference -ExclusionPath "E:\tools\cracksentinel"
            ```

            Or run with `-no-yara`; the internal engine keeps working.

            ### Build it yourself

            The source is public and builds with one command:

            ```
            go build -trimpath -ldflags "-s -w" -o scanner.exe ./cmd/scanner
            ```

