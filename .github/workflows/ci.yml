name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, out: scanner.exe }
          - { goos: linux, goarch: amd64, out: scanner }
          - { goos: darwin, goarch: arm64, out: scanner-mac }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ${{ matrix.out }} ./cmd/scanner
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.out }}
